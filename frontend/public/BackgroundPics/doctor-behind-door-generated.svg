  </defs>

  <rect width="1200" height="800" fill="url(#wall)"/>
  <rect x="0" y="620" width="1200" height="180" fill="#1e5a70"/>

  <!-- room shelf -->
  <rect x="120" y="150" width="240" height="16" rx="8" fill="#1f4d63" opacity="0.6"/>
  <rect x="840" y="170" width="260" height="16" rx="8" fill="#1f4d63" opacity="0.6"/>
  <rect x="150" y="170" width="26" height="40" rx="8" fill="#f3f8fd" opacity="0.9"/>
  <rect x="185" y="170" width="26" height="52" rx="8" fill="#bfe7f5" opacity="0.9"/>
  <rect x="225" y="170" width="28" height="44" rx="8" fill="#f3f8fd" opacity="0.9"/>

  <!-- doctor -->
  <ellipse cx="640" cy="260" rx="78" ry="92" fill="#f0c39e"/>
  <path d="M570 225 Q640 130 710 225 Q690 180 640 165 Q590 180 570 225Z" fill="#3e2d22"/>
  <rect x="530" y="350" width="220" height="285" rx="34" fill="url(#coat)"/>
