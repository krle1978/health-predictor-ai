  <circle cx="640" cy="514" r="20" fill="#2e4556"/>
  <circle cx="640" cy="514" r="10" fill="#93a9b7"/>
  <circle cx="590" cy="350" r="13" fill="#93a9b7"/>
  <circle cx="690" cy="350" r="13" fill="#93a9b7"/>

  <!-- folder -->
  <rect x="470" y="470" width="185" height="122" rx="12" fill="#d6b27b"/>
  <rect x="490" y="445" width="84" height="32" rx="8" fill="#c69b5d"/>
  <line x1="500" y1="505" x2="625" y2="505" stroke="#b48b53" stroke-width="6"/>
  <line x1="500" y1="535" x2="625" y2="535" stroke="#b48b53" stroke-width="6"/>

